<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#07090f"><title>账户管理</title>
<style>:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}*{box-sizing:border-box}body{margin:0;background:#07090f;color:#f5f6fa}main{width:min(100%,980px);margin:auto;padding:22px 16px 48px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}h1{margin:0;font-size:25px}button{border:1px solid #303647;border-radius:10px;padding:10px 12px;background:#151925;color:#f5f6fa;font:inherit;font-weight:700;cursor:pointer}button.danger{color:#ff647c}button.primary{border-color:#ff4d68;background:#ff4d68}.account{display:grid;grid-template-columns:1fr auto;gap:14px;padding:17px 0;border-top:1px solid #242938}.account:first-child{border-top:0}.identity{font-size:18px;font-weight:800}.key-field{width:min(100%,300px);border:0;background:transparent;color:#f5f6fa;font:inherit;font-size:18px;font-weight:800;letter-spacing:.04em;outline:none}.meta{margin-top:7px;color:#929bad;font-size:13px;line-height:1.7}.status{color:#5ed7b0}.status.off{color:#ff647c}.actions{display:flex;flex-wrap:wrap;justify-content:flex-end;align-content:center;gap:8px}#empty{padding:50px 0;text-align:center;color:#929bad}@media(max-width:680px){.account{grid-template-columns:1fr}.actions{justify-content:flex-start}}</style></head>
<body><main><header><h1>账户管理</h1><div class="actions"><button id="create" class="primary">创建体验账号</button><button id="logout">退出管理</button></div></header><section id="accounts"></section><div id="empty" hidden>还没有创建体验账户</div></main>
<script>
const formatTime=value=>value?new Date(value).toLocaleString('zh-CN',{hour12:false}):'—';
async function copyText(value){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(value);return true}}catch{}const input=document.createElement('textarea');input.value=value;input.setAttribute('readonly','');input.style.position='fixed';input.style.opacity='0';document.body.append(input);input.select();input.setSelectionRange(0,input.value.length);let copied=false;try{copied=document.execCommand('copy')}catch{}input.remove();if(!copied)window.prompt('请长按复制密钥',value);return copied}
async function loadAccounts(){const response=await fetch('/api/admin/accounts',{cache:'no-store'});if(response.status===403){location.replace('/login.html');return}const result=await response.json();const container=document.querySelector('#accounts');container.replaceChildren();document.querySelector('#empty').hidden=result.accounts.length>0;result.accounts.forEach(account=>{const article=document.createElement('article');article.className='account';const statusLabel=account.status==='lifetime'?'永久':account.status==='suspended'?'已暂停':account.active?'体验中':'已到期';const expiry=account.status==='lifetime'?'永久':formatTime(account.trialEndsAt);const keyArea=account.loginKey?`<input class="key-field" readonly value="${account.loginKey}" aria-label="登录密钥">`:`<div class="identity">旧账号 ····${account.keySuffix}</div>`;const keyButton=account.loginKey?'<button data-copy>复制密钥</button>':'<button data-action="resetKey">重置密钥</button>';const usage=account.aiUsage||{};const aiLabel=account.aiEnabled?'AI 已开启':'AI 已关闭';const aiAction=account.aiEnabled?'disableAi':'enableAi';article.innerHTML=`<div>${keyArea}<div class="meta">账号：${account.id}<br><span class="status ${account.active?'':'off'}">${statusLabel}</span><br>创建：${formatTime(account.createdAt)}<br>使用截止：${expiry}<br>最近登录：${formatTime(account.lastLoginAt)}<br><span class="status ${account.aiEnabled?'':'off'}">${aiLabel}</span> · 日历 ${usage.calendarRemaining??5}/5 · 预测 ${usage.forecastRemaining??5}/5</div></div><div class="actions">${keyButton}<button data-action="${aiAction}">${account.aiEnabled?'关闭 AI':'开启 AI'}</button><button data-action="extend7">续 7 天</button><button data-action="extend30">续 1 个月</button><button class="primary" data-action="lifetime">永久</button><button data-action="suspend">暂停</button><button class="danger" data-action="delete">删除</button></div>`;const copyButton=article.querySelector('[data-copy]');if(copyButton)copyButton.onclick=async event=>{const keyField=article.querySelector('.key-field');keyField.focus();keyField.select();keyField.setSelectionRange(0,keyField.value.length);const copied=await copyText(keyField.value);event.currentTarget.textContent=copied?'已复制':'请长按密钥复制'};article.querySelectorAll('[data-action]').forEach(button=>button.onclick=async()=>{const action=button.dataset.action;if(action==='delete'&&!confirm(`确定删除 ${account.id}？\n账户及其全部数据将永久删除，无法恢复。`))return;if(action==='resetKey'&&!confirm(`旧密钥无法恢复。确定为 ${account.id} 生成新密钥吗？`))return;button.disabled=true;const response=await fetch('/api/admin/account-status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:account.id,action})});const result=await response.json();if(!response.ok)alert(result.error||'操作失败');if(result.deletedId){localStorage.removeItem(`portfolioDashboardLocalPortfolioV1:user:${result.deletedId}`);localStorage.removeItem(`portfolioDashboardLocalPortfolioV1:user:${result.deletedId}:pending`);localStorage.removeItem(`portfolioInvestmentPlanDraftV1:${result.deletedId}`)}await loadAccounts()});container.append(article)})}
document.querySelector('#logout').onclick=async()=>{await fetch('/api/logout',{method:'POST',body:'{}'});location.replace('/login.html')};loadAccounts();
document.querySelector('#create').onclick=async event=>{const createButton=event.currentTarget;createButton.disabled=true;try{const response=await fetch('/api/admin/create-account',{method:'POST',body:'{}'});const result=await response.json();if(!response.ok)throw new Error(result.error||'创建失败');await loadAccounts()}catch(error){alert(error.message)}finally{createButton.disabled=false}};
</script></body></html>
