<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#07090f"><title>进入持仓看板</title>
<style>:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:#07090f;color:#f6f7fb}main{width:min(100%,380px);visibility:hidden}body.ready main{visibility:visible}h1{margin:0 0 14px;color:#929bad;font-size:15px;font-weight:650}input,button{width:100%;border-radius:13px;font:inherit}input{padding:17px;border:1px solid #2a3040;background:#11141d;color:#f6f7fb;font-size:19px;letter-spacing:.08em;outline:none}input:focus{border-color:#ff4d68;box-shadow:0 0 0 3px rgba(255,77,104,.13)}button{padding:15px;border:1px solid #2a3040;background:#151925;color:#f6f7fb;font-weight:750;cursor:pointer}button.primary{margin-top:12px;border-color:#ff4d68;background:#ff4d68}button.secondary{margin-top:14px;background:transparent;color:#b9c0ce}button:disabled{opacity:.55}#login-error{min-height:22px;margin:10px 2px 0;color:#ff667d;font-size:14px}.created{margin-top:18px;padding:18px;border:1px solid #2a3040;border-radius:16px;background:#11141d}.created p{margin:0;color:#929bad;font-size:13px;line-height:1.6}.created strong{display:block;margin:10px 0 4px;color:#fff;font-size:24px;letter-spacing:.08em}</style></head>
<body><main><h1>密钥</h1><form id="login-form"><input id="login-key" type="password" maxlength="32" autocomplete="current-password" autocapitalize="none" spellcheck="false" aria-label="密钥" required><button class="primary" type="submit">进入</button><p id="login-error" role="alert"></p></form></main>
<script>
const destination=result=>result.mode==='admin'?'/admin.html':result.mode==='user'?`/index.html?local=1&mode=user&user=${encodeURIComponent(result.userId)}`:`/index.html?mode=${encodeURIComponent(result.mode)}`;
(async()=>{try{const response=await fetch('/api/session',{cache:'no-store'});const result=await response.json();if(result.authenticated){localStorage.setItem('portfolioSessionMode',result.mode);location.replace(destination(result));return}}catch{}document.body.classList.add('ready');document.querySelector('#login-key').focus()})();
document.querySelector('#login-form').addEventListener('submit',async event=>{event.preventDefault();const error=document.querySelector('#login-error');const input=document.querySelector('#login-key');const button=event.submitter;button.disabled=true;error.textContent='';try{const response=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:input.value})});const result=await response.json();if(!response.ok)throw new Error(result.error||'登录失败');localStorage.setItem('portfolioSessionMode',result.mode);location.replace(destination(result))}catch(loginError){error.textContent=loginError.message;button.disabled=false;input.select()}});
</script></body></html>
